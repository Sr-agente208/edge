<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Bing (fixture)</title>
<style>
  body { font-family: sans-serif; }
  #sb_form_q { width: 520px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Bing</h1>
  <form id="sb_form" onsubmit="return false;">
    <input id="sb_form_q" name="q" autocomplete="off" />
  </form>
  <div id="search-count" style="color:#666;">buscas: 0</div>
  <script>
    let count = 0;
    document.getElementById('sb_form_q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        count++;
        document.getElementById('search-count').textContent = 'buscas: ' + count;
        document.title = 'Resultado: ' + e.target.value;
      }
    });
  </script>
</body>
</html>
